name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — rescans history on a schedule, not only on pushes
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secrets in git history)
    runs-on: ubuntu-latest
    # Dependabot PRs only modify dependency versions — they cannot
    # introduce committed secrets, and gitleaks-action@v2 fails on them
    # because Dependabot's GITHUB_TOKEN is read-only and the action
    # tries to write PR comments.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    # gitleaks-action calls GET /repos/{owner}/{repo}/pulls/{n}/commits
    # on pull_request events. The workflow's top-level permissions
    # grant only contents: read, so this job needs an explicit
    # pull-requests: read scope; without it the action 403s.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # SHA-pinned: third-party action on a floating major tag is a
      # supply-chain risk — the maintainer can move v2 to any commit
      # at any time. This SHA equals the v2.3.9 release. Dependabot
      # (github-actions ecosystem) will surface a PR to bump it when
      # a new tag ships.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
