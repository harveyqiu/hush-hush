# CodeRabbit configuration for hush-hush.
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
# Schema: https://coderabbit.ai/integrations/schema.v2.json

language: en

reviews:
  # Assertive: this is a secret keeper — security trumps brevity.
  profile: assertive

  # We don't gate merges on CodeRabbit's request-changes; CI plus (eventually)
  # a GitHub Ruleset is the source of truth.
  request_changes_workflow: false

  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # Don't burn review tokens on lockfiles or generated artifacts.
  path_filters:
    - "!**/package-lock.json"
    - "!**/*.lock"

  # Path-specific instructions teach CodeRabbit what matters where.
  # Keep these tight — long instructions dilute the signal.
  path_instructions:
    - path: "worker/src/**"
      instructions: |
        Personal secret keeper on Cloudflare Workers + D1. Server-side
        AES-256-GCM with the master key as a Worker secret is intentional —
        DO NOT flag that design. Focus on:
          * AEAD nonce uniqueness (12-byte random per encrypt)
          * AAD binding includes BOTH the version byte AND the name — any
            change that decouples them is a downgrade-attack vector
          * Bearer tokens are hashed with SHA-256 and compared with a
            constant-time compare
          * SQL is parameterized; the only interpolated values are integer
            literals or constants
          * Error messages don't leak internals (DB -> "db error",
            crypto -> "decrypt failed")
          * Cache-Control: no-store on every API response
          * Writes commit atomically with their audit row; reads fail closed
            when the audit row can't be written
          * 403, never 404, for names outside an agent's grant
          * No secret value or token in logs, errors or audit rows
        Threat model is "personal dev secrets" — flag any change that
        broadens it without explicit acknowledgement.

    - path: "worker/test/**"
      instructions: |
        Tests run inside workerd via @cloudflare/vitest-pool-workers. Assert
        on the API's contract (status, body, audit rows), not on internals.
        Avoid sleeps. Don't commit high-entropy literals: gitleaks flags
        them (derive test keys at runtime).

    - path: ".github/workflows/**"
      instructions: |
        * Action versions on latest major; third-party actions pinned to a SHA
        * GITHUB_TOKEN permissions stay minimal (contents: read default)
        * deploy.yml must stay gated by vars.DEPLOY_ENABLED, run only on main,
          never trigger on pull_request, and pass Cloudflare credentials only
          to the migration and deploy steps

    - path: ".github/dependabot.yml"
      instructions: |
        Grouped updates only — ungrouped Dependabot floods the queue
        for a personal project.

  tools:
    github-checks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
